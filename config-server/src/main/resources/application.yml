spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/vasireddyprashanth/ecommerce-config-server.git
          username: vasireddyprashanth
          password: ${GITHUB_TOKEN}
          default-label: main

server:
  port: 8888

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka