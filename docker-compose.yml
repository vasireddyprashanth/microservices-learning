services:
  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      - GITHUB_TOKEN
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka

  order-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234p
      - POSTGRES_DB=orderDB
    volumes:
      - order-db-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234p
      - POSTGRES_DB=inventoryDB
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  order-service:
    build: ./order-service
    ports:
      - "9020:9020"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/orderDB
    depends_on:
      - config-server
      - discovery-service
      - order-db

  inventory-service:
    build: ./inventory-service
    ports:
      - "9010:9010"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventoryDB
    depends_on:
      - config-server
      - discovery-service
      - inventory-db

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    depends_on:
      - config-server
      - discovery-service



volumes:
  order-db-data:
  inventory-db-data:

